[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepwiki-cli"
version = "1.0.0"
description = "High-performance asynchronous CLI documentation crawler for DeepWiki and GitHub repositories"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["deepwiki", "crawler", "scraper", "markdown", "documentation", "github", "crawl4ai", "playwright", "rag", "cli"]
dependencies = [
    "crawl4ai>=0.9.0",
    "playwright>=1.50.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.scripts]
deepwiki = "deepwiki_crawler:main"
deepwiki-cli = "deepwiki_crawler:main"

[tool.setuptools]
py-modules = ["deepwiki_crawler"]
